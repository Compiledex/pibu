<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Pibu App Prototype</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=IBM+Plex+Sans+KR:wght@400;500;600&family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">
<style>
/* Pibu (피부 = "skin"). Layout: one phone column, top bar, scrolling screen, bottom tab bar. */
:root{
  --app-name:"Pibu";
  --bg:#F2F5F3;          /* porcelain, slightly green */
  --surface:#FFFFFF;
  --ink:#17202D;
  --muted:#5B6574;
  --line:#DCE3E0;
  --cica:#1E7A62;        /* centella / cica green */
  --cica-ink:#0F5443;
  --cica-soft:#DDEFE7;
  --blush:#F7D6DE;
  --warn:#9A5B0E;
  --warn-soft:#FBEBD5;
  --bad:#A33A3A;
  --display:"Gowun Batang", "Noto Serif KR", Georgia, serif;
  --body:"IBM Plex Sans KR", "Noto Sans JP", system-ui, -apple-system, "Segoe UI", sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,[tabindex]:focus-visible,input:focus-visible{outline:2px solid var(--cica);outline-offset:2px}
@media (min-width:640px){ body:not(.framed){background:#DCE4E0} body:not(.framed) .app{border-radius:28px;box-shadow:0 30px 80px -30px rgba(23,32,45,.35);height:calc(100% - 48px);margin-top:24px} }

.app{position:relative;height:100%;max-width:440px;margin:0 auto;background:var(--bg);display:flex;flex-direction:column;overflow:hidden}

/* fake phone status bar, only inside the presentation frame */
.status{display:none;height:44px;padding:0 26px;align-items:center;justify-content:space-between;font-size:14px;font-weight:600;flex:none}
.framed .status{display:flex}
.status .icons{display:flex;gap:6px;align-items:center}
.status svg{display:block}

.top{display:flex;align-items:center;justify-content:space-between;padding:10px 20px 6px;flex:none;min-height:52px}
.logo{font-family:var(--display);font-size:24px;font-weight:700;letter-spacing:-.01em;display:flex;align-items:baseline;gap:6px;background:none;border:0;padding:0}
.logo small{font-family:var(--body);font-size:12px;color:var(--muted);font-weight:500}
.lang-btn{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:5px 12px;font-size:13px}

.screen{flex:1;overflow-y:auto;overflow-x:hidden;padding:6px 20px 24px;scroll-behavior:smooth}
.screen > *{animation:in .35s ease both}
@keyframes in{from{opacity:.0;transform:translateY(8px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

h1,h2{font-family:var(--display);font-weight:700;letter-spacing:-.015em;text-wrap:balance;margin:0}
h1{font-size:30px;line-height:1.15}
h2{font-size:22px;line-height:1.2}
p{margin:0}
.muted{color:var(--muted)}
.small{font-size:13px}
.stack{display:flex;flex-direction:column;gap:12px}
.row{display:flex;gap:10px;align-items:center}
.spacer{flex:1}

.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;border:0;border-radius:14px;padding:15px 18px;font-weight:600;font-size:16px;background:var(--ink);color:#fff;transition:transform .12s}
.btn:active{transform:scale(.98)}
.btn.green{background:var(--cica)}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
.btn.text{background:none;color:var(--muted);padding:10px;font-weight:500;font-size:14px}
.btn[disabled]{opacity:.35;cursor:default}

.card{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:16px}
.chip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:8px 14px;font-size:14px}
.chip[aria-pressed="true"]{background:var(--ink);color:#fff;border-color:var(--ink)}
.chip.off{opacity:.45}
.tag{display:inline-flex;align-items:center;gap:4px;border-radius:6px;padding:2px 7px;font-size:12px;font-weight:600}
.tag.green{background:var(--cica-soft);color:var(--cica-ink)}
.tag.warn{background:var(--warn-soft);color:var(--warn)}
.tag.ad{border:1px solid var(--ink);color:var(--ink);padding:1px 6px}
.tag.ai{background:#E9ECF3;color:#33415C}

/* welcome */
.hero-art{height:230px;margin:6px -20px 18px;position:relative;overflow:hidden}
.hero-art canvas{width:100%;height:100%;display:block}
.langs{display:flex;flex-wrap:wrap;gap:8px}

/* consent */
.consent-row{display:flex;gap:14px;align-items:flex-start;padding:14px 0;border-top:1px solid var(--line)}
.consent-row:first-of-type{border-top:0}
.switch{flex:none;width:50px;height:30px;border-radius:999px;background:#C9D1CE;border:0;position:relative;transition:background .2s}
.switch::after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#fff;transition:transform .2s;box-shadow:0 1px 3px rgba(0,0,0,.2)}
.switch[aria-checked="true"]{background:var(--cica)}
.switch[aria-checked="true"]::after{transform:translateX(20px)}
.notice{display:flex;gap:10px;background:#E9ECF3;border-radius:14px;padding:12px 14px;font-size:13px;color:#33415C}

/* photo */
.face-wrap{position:relative;aspect-ratio:1/1.08;border-radius:24px;overflow:hidden;background:linear-gradient(160deg,#E7EEEA,#D3DFD9)}
.face-wrap svg{position:absolute;inset:0;width:100%;height:100%}
.face-wrap.blurry svg.face{filter:blur(6px) brightness(.55)}
.scanline{position:absolute;left:0;right:0;height:3px;background:var(--cica);box-shadow:0 0 18px 4px rgba(30,122,98,.55);top:0;animation:scan 1.6s ease-in-out infinite alternate}
@keyframes scan{to{top:calc(100% - 3px)}}
.dots circle{opacity:0;animation:pop .4s ease forwards}
@keyframes pop{to{opacity:1}}
.zone{position:absolute;border:2px solid #fff;border-radius:50%;box-shadow:0 0 0 2px rgba(30,122,98,.7);opacity:0;animation:pop .5s ease forwards}
.zone-label{position:absolute;background:#fff;border-radius:8px;padding:3px 8px;font-size:12px;font-weight:600;white-space:nowrap;opacity:0;animation:pop .5s ease forwards;box-shadow:0 2px 8px rgba(0,0,0,.12)}
.result-list{display:flex;flex-direction:column;gap:8px}
.result-item{display:flex;justify-content:space-between;align-items:center;gap:10px}
.meter{flex:none;width:96px;height:6px;border-radius:3px;background:var(--line);overflow:hidden}
.meter i{display:block;height:100%;background:var(--cica);border-radius:3px}

/* quiz */
.progress{display:flex;gap:6px;margin:4px 0 18px}
.progress i{flex:1;height:4px;border-radius:2px;background:var(--line)}
.progress i.on{background:var(--cica)}
.options{display:flex;flex-direction:column;gap:10px}
.option{display:flex;align-items:center;gap:12px;text-align:left;width:100%;background:var(--surface);border:1.5px solid var(--line);border-radius:16px;padding:14px 16px;font-size:15px;transition:border-color .15s, background .15s}
.option .em{width:36px;height:36px;border-radius:10px;background:var(--bg);display:grid;place-items:center;flex:none}
.option[aria-pressed="true"]{border-color:var(--cica);background:var(--cica-soft)}
.option b{display:block;font-weight:600}
.option span.sub{display:block;font-size:13px;color:var(--muted)}

/* analyzing */
.analyzing{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:22px;text-align:center;min-height:70%}
.orbit{width:120px;height:120px;position:relative}
.orbit i{position:absolute;inset:0;border-radius:50%;border:2px solid var(--cica);opacity:.0;animation:ripple 1.8s ease-out infinite}
.orbit i:nth-child(2){animation-delay:.6s}.orbit i:nth-child(3){animation-delay:1.2s}
@keyframes ripple{from{transform:scale(.3);opacity:.9}to{transform:scale(1);opacity:0}}
.steps-log{font-size:14px;color:var(--muted);display:flex;flex-direction:column;gap:6px;min-height:84px}
.steps-log div{animation:in .3s ease both}

/* routine */
.profile-card{background:var(--ink);color:#fff;border-radius:20px;padding:18px;display:flex;flex-direction:column;gap:10px}
.profile-card .tags{display:flex;flex-wrap:wrap;gap:6px}
.profile-card .tag{background:rgba(255,255,255,.12);color:#fff}
.tabs{display:flex;background:#E4EAE7;border-radius:12px;padding:4px}
.tabs button{flex:1;border:0;background:none;border-radius:9px;padding:9px;font-weight:600;font-size:14px;color:var(--muted)}
.tabs button[aria-selected="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.08)}
.step{display:flex;gap:12px;align-items:flex-start}
.step-num{flex:none;width:26px;height:26px;border-radius:50%;border:1.5px solid var(--line);display:grid;place-items:center;font-size:13px;font-weight:600;color:var(--muted);margin-top:14px;background:var(--bg)}
.product{flex:1;display:flex;flex-direction:column;gap:8px}
.product-top{display:flex;gap:12px;align-items:center}
.bottle{flex:none;width:44px;height:58px}
.pname{font-weight:600;line-height:1.25}
.pmeta{font-size:13px;color:var(--muted)}
.price{font-variant-numeric:tabular-nums;font-weight:600;white-space:nowrap}
.why{border:0;background:none;padding:0;color:var(--cica-ink);font-size:13px;font-weight:600;text-align:left}
.why-box{background:var(--bg);border-radius:12px;padding:10px 12px;font-size:13px;display:flex;flex-direction:column;gap:6px}
.total{display:flex;justify-content:space-between;align-items:center;padding:14px 16px;border-radius:16px;background:var(--cica-soft);color:var(--cica-ink);font-weight:600}
.aisle{display:inline-flex;gap:4px;align-items:center;font-size:12px;color:var(--muted)}

/* label scan */
.label-card{position:relative;background:#FBFAF7;border:1px solid #E6E1D6;border-radius:18px;padding:18px 18px 16px;overflow:hidden;font-family:"IBM Plex Sans KR",sans-serif}
.label-card .kname{font-family:var(--display);font-size:20px;font-weight:700}
.label-card .ing{font-size:13px;line-height:1.7;color:#3D3A33}
.label-card .scanline{animation-duration:1.1s}
.ing-list{display:flex;flex-direction:column}
.ing-row{display:flex;gap:10px;padding:10px 0;border-top:1px solid var(--line);animation:in .3s ease both}
.ing-row:first-child{border-top:0}
.ing-row .ko{font-size:12px;color:var(--muted)}
.ing-row .mark{flex:none;width:22px;height:22px;border-radius:50%;display:grid;place-items:center;font-size:13px;font-weight:700;margin-top:2px}
.mark.ok{background:var(--cica-soft);color:var(--cica-ink)}
.mark.warn{background:var(--warn-soft);color:var(--warn)}
.mark.neutral{background:#ECEFEE;color:var(--muted)}
.verdict{border-radius:16px;padding:14px 16px;display:flex;flex-direction:column;gap:4px}
.verdict.warn{background:var(--warn-soft);color:#5E3906}
.verdict.ok{background:var(--cica-soft);color:var(--cica-ink)}

/* chat */
.chat{display:flex;flex-direction:column;gap:10px;padding-bottom:8px}
.msg{max-width:86%;padding:10px 14px;border-radius:18px;font-size:15px;animation:in .25s ease both}
.msg.me{align-self:flex-end;background:var(--ink);color:#fff;border-bottom-right-radius:6px}
.msg.ai{align-self:flex-start;background:var(--surface);border:1px solid var(--line);border-bottom-left-radius:6px;display:flex;flex-direction:column;gap:8px}
.msg .src{font-size:12px;color:var(--muted);border-top:1px solid var(--line);padding-top:6px}
.typing{display:inline-flex;gap:4px;padding:4px 2px}
.typing i{width:7px;height:7px;border-radius:50%;background:var(--muted);animation:blink 1s infinite}
.typing i:nth-child(2){animation-delay:.15s}.typing i:nth-child(3){animation-delay:.3s}
@keyframes blink{0%,100%{opacity:.25}50%{opacity:1}}
.suggest{display:flex;gap:8px;overflow-x:auto;padding:4px 0 2px;scrollbar-width:none}
.suggest .chip{white-space:nowrap;flex:none}
.composer{flex:none;display:flex;gap:8px;padding:10px 16px;border-top:1px solid var(--line);background:var(--bg)}
.composer input{flex:1;border:1px solid var(--line);border-radius:999px;padding:11px 16px;font:inherit;background:var(--surface);min-width:0}
.composer button{border:0;border-radius:50%;width:44px;height:44px;background:var(--cica);color:#fff;display:grid;place-items:center;flex:none}

/* check-in */
.lock{border-radius:24px;padding:26px 18px;background:linear-gradient(170deg,#1E2A3A,#2D4A44);color:#fff;display:flex;flex-direction:column;align-items:center;gap:6px;min-height:300px}
.lock .clock{font-size:64px;font-weight:300;letter-spacing:-.03em;line-height:1;margin-top:10px;font-variant-numeric:tabular-nums}
.notif{margin-top:auto;width:100%;background:rgba(255,255,255,.92);color:var(--ink);border-radius:18px;padding:12px 14px;display:flex;gap:12px;align-items:flex-start;text-align:left;border:0;animation:drop .6s cubic-bezier(.2,.9,.3,1.2) .3s both}
@keyframes drop{from{transform:translateY(-30px);opacity:0}to{transform:none;opacity:1}}
.app-icon{flex:none;width:38px;height:38px;border-radius:10px;background:var(--cica);color:#fff;display:grid;place-items:center;font-family:var(--display);font-weight:700;font-size:20px}
.faces{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.faces .option{flex-direction:column;text-align:center;padding:16px 8px;gap:6px}
.loop{display:flex;align-items:center;justify-content:space-between;gap:6px;font-size:12px;text-align:center;color:var(--muted)}
.loop div{flex:1;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:8px 4px}
.loop div.hl{border-color:var(--cica);color:var(--cica-ink);font-weight:600}

/* me */
.list{display:flex;flex-direction:column}
.list .li{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:13px 0;border-top:1px solid var(--line)}
.list .li:first-child{border-top:0}

/* bottom nav */
.nav{flex:none;display:flex;justify-content:space-around;border-top:1px solid var(--line);background:var(--surface);padding:6px 6px calc(6px + env(safe-area-inset-bottom))}
.nav button{border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;font-weight:500;color:var(--muted);padding:6px 10px;border-radius:10px;min-width:64px}
.nav button[aria-current="page"]{color:var(--cica-ink)}
.nav svg{width:24px;height:24px}
.framed .nav{padding-bottom:22px}

/* toast + demo panel */
.toast{position:absolute;left:50%;bottom:96px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 16px;border-radius:12px;font-size:14px;z-index:30;max-width:86%;text-align:center;animation:in .25s ease both}
.demo-panel{position:absolute;inset:auto 12px 12px 12px;background:var(--ink);color:#fff;border-radius:18px;padding:14px;z-index:40;display:none;flex-direction:column;gap:8px}
.demo-panel.open{display:flex}
.demo-panel .grid{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.demo-panel button{border:1px solid rgba(255,255,255,.2);background:rgba(255,255,255,.06);color:#fff;border-radius:10px;padding:8px;font-size:13px;text-align:left}
</style>
</head>

/* ============ derived profile + routine ============ */
function profile(){
  const a=S.answers, tags=[];
  const type={a:"Oily",b:"Combination",c:"Dry",d:"Normal"}[a.feel] || "Combination";
  const typeJa={Oily:"脂性肌",Combination:"混合肌",Dry:"乾燥肌",Normal:"普通肌"}[type];
  const sens = a.sens==="a" || a.sens==="b";
  const main = S.lang==="ja" ? typeJa + (sens?"・敏感寄り":"") : type + (sens?", sensitive-leaning":"");
  (a.concerns.length?a.concerns:["redness","pores"]).forEach(c=>tags.push(T[S.lang].concerns[c]));
  if(S.photo==="done") tags.push(S.lang==="ja"?"写真あり":"Photo-checked");
  return {type, sens, main, tags};
}
function routine(){
  const a=S.answers, pr=profile(), c=a.concerns.length?a.concerns:["redness","pores"];
  const low = a.budget==="a", five = a.steps!=="a";
  const cleanser = low? P.cleanserRice : P.cleanserGel;
  const toner = c.includes("redness")||pr.sens ? P.tonerCica : c.includes("acne")||c.includes("pores") ? P.tonerBHA : P.tonerHydra;
  const serum = pr.sens||c.includes("dryness") ? P.serumPanth : P.serumNia;
  const cream = pr.type==="Dry"||(pr.sens&&pr.type!=="Oily") ? P.creamCer : P.creamGel;
  let am, pm;
  if(five){ am=[cleanser,toner,serum,cream,P.sun]; pm=[cleanser,toner,(pr.sens?P.serumPanth:P.serumNia),cream]; }
  else { am=[cleanser,cream,P.sun]; pm=[cleanser,toner,cream]; }
  if(S.checkinSwap){ const sw=x=>x===P.tonerCica||x===P.tonerBHA?P.tonerHydra:x; am=am.map(sw); pm=pm.map(sw); }
  if(!S.consent.ads){ am=am.map(x=>x.ad?{...x,ad:false,brand:"Ondo",name:"Daily Sun Cream SPF50+",ko:"온도 데일리 선크림",price:15500}:x); }
  const uniq=[...new Set([...am,...pm])];
  return {am, pm, total: uniq.reduce((s,p)=>s+p.price,0)};
}

/* little illustrated shelf for the welcome screen */
function drawShelf(){
  const c=$("shelf"); if(!c) return; const r=c.getBoundingClientRect(), dpr=window.devicePixelRatio||1;
  c.width=r.width*dpr; c.height=r.height*dpr; const g=c.getContext("2d"); g.scale(dpr,dpr);
  const W=r.width,H=r.height, cols=["#9FCDB9","#F4DFC8","#D9E6F2","#EBD3DC","#F6E9B8","#CFE6DE","#BFD3EA","#EFE6DA","#F7D6DE"];
  g.fillStyle="#E6ECE9"; g.fillRect(0,0,W,H);
  let seed=7; const rnd=()=>{seed=(seed*16807)%2147483647; return seed/2147483647;};
  const rows=3, rowH=H/rows;
  for(let ry=0;ry<rows;ry++){
    const base=(ry+1)*rowH-10; g.fillStyle="#C9D3CF"; g.fillRect(0,base,W,10);
    let x=8; while(x<W){ const w=16+rnd()*16, h=rowH*(.45+rnd()*.4), col=cols[Math.floor(rnd()*cols.length)];
      g.fillStyle=col; const rr=Math.min(6,w/3); g.beginPath(); g.roundRect?g.roundRect(x,base-h,w,h,[rr,rr,2,2]):g.rect(x,base-h,w,h); g.fill();
      g.fillStyle="rgba(23,32,45,.78)"; g.fillRect(x+w*.3,base-h-6,w*.4,6);
      g.fillStyle="rgba(23,32,45,.18)"; g.fillRect(x+3,base-h*.45,w-6,2.5);
      x+=w+4; }
  }
  // the one product that is "yours"
  const hx=W*.62, hy=rowH*2-10; g.strokeStyle="#1E7A62"; g.lineWidth=3; g.beginPath(); g.arc(hx,hy-rowH*.32,rowH*.42,0,Math.PI*2); g.stroke();
  g.fillStyle="#1E7A62"; g.beginPath(); g.roundRect?g.roundRect(hx-44,hy-rowH*.32-rowH*.42-30,88,24,12):g.rect(hx-44,hy-rowH*.74-30,88,24); g.fill();
  g.fillStyle="#fff"; g.font="600 12px 'IBM Plex Sans KR', sans-serif"; g.textAlign="center"; g.fillText(S.lang==="ja"?"あなたの一本":"Yours",hx,hy-rowH*.32-rowH*.42-13);
}

/* ============ events ============ */
document.addEventListener("click", e=>{
  const b=e.target.closest("button"); if(!b) return;
  const d=b.dataset;
  if(d.go){ if(d.go==="routine" && !S.answers.feel) fillDemo(); go(d.go); return; }
  if(d.lang){ S.lang=d.lang; render(); return; }
  if(d.consent){ S.consent[d.consent]=!S.consent[d.consent]; b.setAttribute("aria-checked",S.consent[d.consent]); return; }
  if(d.ans){ const k=d.ans,v=d.val; if(k==="concerns"){ const a=S.answers.concerns; const i=a.indexOf(v); if(i>=0)a.splice(i,1); else if(a.length<3)a.push(v); } else S.answers[k]=v; render(); return; }
  if(d.tab){ S.tab=d.tab; S.open=null; render(); return; }
  if(d.why){ S.open = S.open===d.why?null:d.why; const y=$("screen").scrollTop; render(); $("screen").scrollTop=y; return; }
  if(d.q){ const qa=QA().find(x=>x.q===d.q); ask(d.q,qa); return; }
  if(d.feel){ S.feeling=d.feel; render(); return; }
  const act=d.act; if(!act) return;
  ({
    toggleLang(){ S.lang=S.lang==="en"?"ja":"en"; render(); },
    demoOnly(){ toast(t("demoOnly")); },
    back(){ const order=["welcome","consent","photo","quiz"]; if(S.screen==="quiz"&&S.q>0){S.q--;render();return;} if(S.screen==="checkin"){go("me");return;} const i=order.indexOf(S.screen); go(order[Math.max(0,i-1)]); },
    consentNext(){ if(S.consent.photo){ S.photo="idle"; go("photo"); } else { S.q=0; go("quiz"); } },
    skipPhoto(){ S.consent.photo=false; S.q=0; go("quiz"); },
    demoPhoto(){ S.photo="scanning"; S.photoNext="done"; render(); },
    blurryPhoto(){ S.photo="scanning"; S.photoNext="blurry"; render(); },
    toQuiz(){ S.q=0; go("quiz"); },
    quizNext(){ if(S.q<4){ S.q++; render(true); } else go("analyzing"); },
    demoAnswers(){ fillDemo(); S.q=4; render(); },
    save(){ toast(t("saved")); },
    scan(){ S.scan="scanning"; render(); },
    rescan(){ S.scan="idle"; render(); },
    openCheckin(){ S.checkin="ask"; render(); },
    submitCheckin(){ S.checkin="done"; render(); },
    seeUpdated(){ S.checkinSwap=true; S.tab="am"; go("routine"); },
    simulate(){ S.checkin="lock"; S.feeling=null; go("checkin"); },
    deleteAll(){ const l=S.lang; S=fresh(); S.lang=l; render(); toast(t("deletedAll")); }
  })[act]?.();
});

document.addEventListener("keydown", e=>{
  if(e.target.tagName==="INPUT") return;
  const keys=Object.keys(JUMPS), n=parseInt(e.key,10);
  if(n>=1 && n<=keys.length){ JUMPS[keys[n-1]](); return; }
  if(e.key==="d"||e.key==="D"){ toggleDemo(); return; }
  if(e.key==="r"||e.key==="R"){ JUMPS.welcome(); return; }
  if(e.key==="l"||e.key==="L"){ S.lang=S.lang==="en"?"ja":"en"; render(); return; }
  if(["ArrowRight","ArrowLeft","PageDown","PageUp"," ","Escape","f","F","n","N"].includes(e.key)){ post({type:"pibu:key",key:e.key}); if(e.key===" ") e.preventDefault(); }
});
function post(msg){ try{ if(window.parent!==window) window.parent.postMessage(msg,"*"); }catch(_){} }
window.addEventListener("message", e=>{
  const m=e.data||{}; if(typeof m!=="object") return;
  if(m.type==="pibu:framed") document.body.classList.add("framed");
  if(m.type==="pibu:goto" && JUMPS[m.screen]) JUMPS[m.screen]();
  if(m.type==="pibu:lang"){ S.lang=m.lang; render(); }
  if(m.type==="pibu:ask" && S.screen==="chat"){ const qa=QA()[m.i||0]; if(qa) ask(qa.q,qa); }
});
if(/[?&]framed/.test(location.search)) document.body.classList.add("framed");
window.addEventListener("resize",()=>{ if(S.screen==="welcome") drawShelf(); });

render();
})();
</script>
</body>
</html>
