<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Pibu</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@300;400;500;600;700&family=Noto+Sans+KR:wght@400;500;700&family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">
<style>
/* Pibu v2. Premium K-beauty: porcelain + blush, deep rose accent, celadon for "good". One family: Manrope, with Noto Sans KR/JP.
   Layout: one phone column, logo bar, scrolling screen, floating tab bar. */
:root{
  --porcelain:#F7F3F1;
  --paper:#FFFFFF;
  --ink:#1F1A24;
  --muted:#6F6673;
  --line:#ECE4E2;
  --rose:#A64D66;
  --rose-deep:#7E3549;
  --blush:#F2DCD9;
  --petal:#FBF1EF;
  --celadon:#9BB8AC;
  --celadon-deep:#3F6A5C;
  --celadon-soft:#E6F0EB;
  --warn:#93590F;
  --warn-soft:#FBEEDC;
  --bad:#A33A3A;
  --display:"Manrope", "Noto Sans KR", "Noto Sans JP", system-ui, sans-serif;
  --body:"Manrope", "Noto Sans KR", "Noto Sans JP", system-ui, -apple-system, "Segoe UI", sans-serif;
  --kr:"Noto Sans KR", sans-serif;
  --shadow:0 1px 2px rgba(31,26,36,.04), 0 8px 24px -12px rgba(31,26,36,.18);
  color-scheme:light;
}
*{box-sizing:border-box}
/* Bodoni at its "text" optical size: sturdier hairlines that survive projectors and small screens */
html,body{height:100%;margin:0}
body{background:var(--porcelain);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,[tabindex]:focus-visible,input:focus-visible{outline:2px solid var(--rose);outline-offset:2px}
#screen:focus,#screen:focus-visible{outline:none}
@media (min-width:640px){ body:not(.framed){background:radial-gradient(1200px 700px at 30% 0%,#FBEDEB,#EFE6E3)} body:not(.framed) .app{border-radius:34px;box-shadow:0 40px 90px -40px rgba(31,26,36,.45);height:calc(100% - 48px);margin-top:24px} }

.app{position:relative;height:100%;max-width:440px;margin:0 auto;background:var(--porcelain);display:flex;flex-direction:column;overflow:hidden}

.status{display:none;height:44px;padding:0 26px;align-items:center;justify-content:space-between;font-size:14px;font-weight:500;flex:none}
.framed .status{display:flex}
.status .icons{display:flex;gap:6px;align-items:center}
.status svg{display:block}

.top{display:flex;align-items:center;justify-content:space-between;padding:10px 20px 8px;flex:none;min-height:56px}
.logo{background:none;border:0;padding:0;display:inline-flex}
.lang-btn{border:1px solid var(--line);background:rgba(255,255,255,.7);backdrop-filter:blur(8px);border-radius:999px;padding:6px 14px;font-size:13px;letter-spacing:.02em}

.screen{flex:1;overflow-y:auto;overflow-x:hidden;padding:4px 20px 20px;scroll-behavior:smooth;display:flex;flex-direction:column}
.app.has-nav .screen{padding-bottom:98px}
.screen > .stack{flex:1 0 auto}
.actions{margin-top:auto;display:flex;flex-direction:column;gap:4px;padding-top:12px}
.framed .app:not(.has-nav) .screen{padding-bottom:26px}
.screen > *{animation:in .45s cubic-bezier(.2,.8,.2,1) both}
@keyframes in{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

h1,h2{font-family:var(--display);font-weight:600;letter-spacing:-.035em;text-wrap:balance;margin:0}
h1{font-size:33px;line-height:1.1;font-weight:500}
h2{font-size:25px;line-height:1.18}
p{margin:0}
.muted{color:var(--muted)}
.small{font-size:13px}
.stack{display:flex;flex-direction:column;gap:12px}
.row{display:flex;gap:10px;align-items:center}
.spacer{flex:1}
.eyebrow{font-size:12px;letter-spacing:.08em;color:var(--rose);font-weight:500}

.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;border:0;border-radius:999px;padding:16px 20px;font-weight:500;font-size:16px;letter-spacing:.01em;background:var(--ink);color:#fff;transition:transform .12s, background .2s;box-shadow:0 10px 24px -14px rgba(31,26,36,.6)}
.btn:active{transform:scale(.98)}
.btn.green{background:var(--ink)}
.btn.rose{background:var(--rose)}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line);box-shadow:none}
.btn.text{background:none;color:var(--muted);padding:10px;font-weight:400;font-size:14px;box-shadow:none}
.btn[disabled]{opacity:.3;cursor:default}

.card{background:var(--paper);border:1px solid var(--line);border-radius:22px;padding:16px;box-shadow:var(--shadow)}
.chip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--paper);border-radius:999px;padding:9px 16px;font-size:14px;transition:all .15s}
.chip[aria-pressed="true"]{background:var(--ink);color:#fff;border-color:var(--ink)}
.chip.off{opacity:.45}
.tag{display:inline-flex;align-items:center;gap:4px;border-radius:999px;padding:3px 9px;font-size:11.5px;font-weight:500;letter-spacing:.02em}
.tag.green{background:var(--celadon-soft);color:var(--celadon-deep)}
.tag.warn{background:var(--warn-soft);color:var(--warn)}
.tag.ad{border:1px solid var(--ink);color:var(--ink);padding:2px 8px}
.tag.ai{background:var(--petal);color:var(--rose-deep)}

/* welcome hero */
.hero-art{height:clamp(170px,34vh,290px);flex:none;margin:0 -20px 22px;position:relative;overflow:hidden;background:radial-gradient(120% 90% at 50% 100%,#F3D9D6 0%,#F7ECEA 45%,var(--porcelain) 75%)}
.hero-art .arc{position:absolute;left:50%;bottom:-160px;width:420px;height:420px;transform:translateX(-50%);border-radius:50%;background:radial-gradient(circle at 50% 30%,#fff 0%,rgba(255,255,255,0) 60%)}
.hero-art .trio{position:absolute;left:0;right:0;bottom:34px;display:flex;justify-content:center;align-items:flex-end;gap:14px}
.hero-art .plinth{position:absolute;left:50%;bottom:22px;transform:translateX(-50%);width:270px;height:22px;border-radius:50%;background:radial-gradient(closest-side,rgba(166,77,102,.18),rgba(166,77,102,0))}
.float-chip{position:absolute;background:rgba(255,255,255,.85);backdrop-filter:blur(10px);border-radius:16px;padding:8px 12px;font-size:12px;box-shadow:var(--shadow);display:flex;gap:8px;align-items:center;animation:float 5s ease-in-out infinite}
.float-chip b{font-family:var(--display);font-size:18px;font-weight:600;letter-spacing:-.03em}
@keyframes float{50%{transform:translateY(-6px)}}
.langs{display:flex;flex-wrap:wrap;gap:8px}

/* consent */
.consent-row{display:flex;gap:14px;align-items:flex-start;padding:15px 0;border-top:1px solid var(--line)}
.consent-row:first-of-type{border-top:0}
.consent-row b{font-weight:500}
.switch{flex:none;width:50px;height:30px;border-radius:999px;background:#D9D0CE;border:0;position:relative;transition:background .2s}
.switch::after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#fff;transition:transform .2s;box-shadow:0 1px 3px rgba(0,0,0,.2)}
.switch[aria-checked="true"]{background:var(--rose)}
.switch[aria-checked="true"]::after{transform:translateX(20px)}
.notice{display:flex;gap:10px;background:var(--petal);border-radius:16px;padding:12px 14px;font-size:13px;color:var(--rose-deep)}

/* photo */
.face-wrap{position:relative;aspect-ratio:1/1.08;border-radius:28px;overflow:hidden;background:radial-gradient(100% 80% at 50% 20%,#FCF3F1,#EBD9D5)}
.face-wrap svg{position:absolute;inset:0;width:100%;height:100%}
.face-wrap.blurry svg.face{filter:blur(6px) brightness(.55)}
.scanline{position:absolute;left:0;right:0;height:2px;background:linear-gradient(90deg,transparent,var(--rose),transparent);box-shadow:0 0 22px 6px rgba(166,77,102,.35);top:0;animation:scan 1.6s ease-in-out infinite alternate}
@keyframes scan{to{top:calc(100% - 2px)}}
.dots circle{opacity:0;animation:pop .4s ease forwards}
@keyframes pop{to{opacity:1}}
.zone{position:absolute;border:1.5px solid #fff;border-radius:50%;box-shadow:0 0 0 2px rgba(166,77,102,.55);opacity:0;animation:pop .5s ease forwards}
.zone-label{position:absolute;background:rgba(255,255,255,.92);backdrop-filter:blur(6px);border-radius:999px;padding:4px 10px;font-size:12px;font-weight:500;white-space:nowrap;opacity:0;animation:pop .5s ease forwards;box-shadow:var(--shadow)}
.score{display:flex;gap:16px;align-items:center}
.ring{position:relative;width:96px;height:96px;flex:none}
.ring svg{transform:rotate(-90deg)}
.ring .val{position:absolute;inset:0;display:grid;place-items:center;text-align:center;line-height:1}
.ring .val b{font-family:var(--display);font-size:28px;font-weight:300;letter-spacing:-.04em;display:block;line-height:.9}
.ring .val span{display:block;margin-top:6px;font-size:9px;color:var(--muted);letter-spacing:.08em}
.ring circle.fg{transition:stroke-dashoffset 1.2s cubic-bezier(.2,.8,.2,1)}
.result-list{display:flex;flex-direction:column;gap:9px;flex:1}
.result-item{display:flex;justify-content:space-between;align-items:center;gap:10px;font-size:14px}
.meter{flex:none;width:84px;height:5px;border-radius:3px;background:var(--line);overflow:hidden}
.meter i{display:block;height:100%;background:linear-gradient(90deg,#E3A8B5,var(--rose));border-radius:3px}

/* quiz */
.progress{display:flex;gap:6px;margin:4px 0 18px}
.progress i{flex:1;height:3px;border-radius:2px;background:var(--line)}
.progress i.on{background:var(--rose)}
.options{display:flex;flex-direction:column;gap:10px}
.option{display:flex;align-items:center;gap:14px;text-align:left;width:100%;background:var(--paper);border:1px solid var(--line);border-radius:20px;padding:15px 16px;font-size:15px;transition:border-color .15s, background .15s, box-shadow .15s}
.option .em svg{width:18px;height:18px}
.option .em{width:62px;padding:0;white-space:nowrap;letter-spacing:-.04em;height:38px;border-radius:999px;background:var(--petal);color:var(--rose-deep);display:grid;place-items:center;flex:none;font-family:var(--display);font-size:16px}
.option[aria-pressed="true"]{border-color:var(--rose);background:var(--petal);box-shadow:0 0 0 3px rgba(166,77,102,.12)}
.option b{display:block;font-weight:500}
.option span.sub{display:block;font-size:13px;color:var(--muted)}

/* analyzing */
.analyzing{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:26px;text-align:center;min-height:72%}
.orbit{width:130px;height:130px;position:relative;display:grid;place-items:center}
.orbit i{position:absolute;inset:0;border-radius:50%;border:1.5px solid var(--rose);opacity:0;animation:ripple 2s ease-out infinite}
.orbit i:nth-child(2){animation-delay:.66s}.orbit i:nth-child(3){animation-delay:1.33s}
@keyframes ripple{from{transform:scale(.35);opacity:.8}to{transform:scale(1);opacity:0}}
.steps-log{font-size:14px;color:var(--muted);display:flex;flex-direction:column;gap:7px;min-height:90px}
.steps-log div{animation:in .3s ease both}

/* routine */
.profile-card{position:relative;overflow:hidden;background:linear-gradient(150deg,#2A2230,var(--ink) 60%);color:#fff;border-radius:26px;padding:20px;display:flex;flex-direction:column;gap:10px;box-shadow:0 18px 40px -22px rgba(31,26,36,.7)}
.profile-card::after{content:"";position:absolute;right:-60px;top:-60px;width:200px;height:200px;border-radius:50%;background:radial-gradient(circle,rgba(242,220,217,.35),rgba(242,220,217,0) 70%)}
.profile-card .tags{display:flex;flex-wrap:wrap;gap:6px}
.profile-card .tag{background:rgba(255,255,255,.12);color:#fff}
.tabs{display:flex;background:#EFE7E5;border-radius:999px;padding:4px}
.tabs button{flex:1;border:0;background:none;border-radius:999px;padding:9px;font-weight:500;font-size:14px;color:var(--muted)}
.tabs button[aria-selected="true"]{background:var(--paper);color:var(--ink);box-shadow:var(--shadow)}
.step{display:flex;gap:12px;align-items:flex-start}
.step-num{flex:none;width:24px;height:24px;border-radius:50%;display:grid;place-items:center;font-size:12px;color:var(--muted);margin-top:18px;font-family:var(--display)}
.product{flex:1;display:flex;flex-direction:column;gap:10px}
.product-top{display:flex;gap:14px;align-items:center}
.product-top .shot{flex:none;width:58px;height:74px;border-radius:16px;background:radial-gradient(90% 80% at 50% 90%,#F3E2DF,#FBF5F4);display:grid;place-items:end center;padding-bottom:4px;overflow:hidden}
.pname{font-weight:500;line-height:1.25}
.pmeta{font-size:12.5px;color:var(--muted)}
.price{font-variant-numeric:tabular-nums;font-weight:500;white-space:nowrap}
.why{border:0;background:none;padding:0;color:var(--rose);font-size:13px;font-weight:500;text-align:left}
.why-box{background:var(--petal);border-radius:14px;padding:11px 13px;font-size:13px;display:flex;flex-direction:column;gap:6px}
.total{display:flex;justify-content:space-between;align-items:center;padding:16px 18px;border-radius:20px;background:var(--paper);border:1px solid var(--line);font-weight:500}
.aisle{display:inline-flex;gap:4px;align-items:center;font-size:12px;color:var(--muted)}

/* label scan */
.label-card{position:relative;background:linear-gradient(180deg,#FFFDFB,#F8F1EC);border:1px solid #EADFD6;border-radius:22px;padding:18px 18px 16px;overflow:hidden;font-family:"Noto Sans KR",sans-serif}
.label-card .kname{font-size:20px;font-weight:400}
.label-card .ing{font-size:13px;line-height:1.75;color:#3D3A33}
.label-card .scanline{animation-duration:1.1s}
.ing-list{display:flex;flex-direction:column}
.ing-row{display:flex;gap:10px;padding:11px 0;border-top:1px solid var(--line);animation:in .3s ease both}
.ing-row:first-child{border-top:0}
.ing-row b{font-weight:500}
.ing-row .ko{font-size:12px;color:var(--muted);font-family:var(--kr)}
.ing-row .mark{flex:none;width:22px;height:22px;border-radius:50%;display:grid;place-items:center;font-size:12px;font-weight:600;margin-top:2px}
.mark.ok{background:var(--celadon-soft);color:var(--celadon-deep)}
.mark.warn{background:var(--warn-soft);color:var(--warn)}
.mark.neutral{background:#F1ECEA;color:var(--muted)}
.verdict{border-radius:20px;padding:15px 17px;display:flex;flex-direction:column;gap:4px}
.verdict b{font-weight:500}
.verdict.warn{background:var(--warn-soft);color:#5E3906}
.verdict.ok{background:var(--celadon-soft);color:var(--celadon-deep)}

/* chat */
.chat{display:flex;flex-direction:column;gap:10px;padding-bottom:8px}
.msg{max-width:86%;padding:11px 15px;border-radius:20px;font-size:15px;animation:in .25s ease both}
.msg.me{align-self:flex-end;background:var(--ink);color:#fff;border-bottom-right-radius:6px}
.msg.ai{align-self:flex-start;background:var(--paper);border:1px solid var(--line);border-bottom-left-radius:6px;display:flex;flex-direction:column;gap:8px;box-shadow:var(--shadow)}
.msg .src{font-size:12px;color:var(--muted);border-top:1px solid var(--line);padding-top:6px}
.typing{display:inline-flex;gap:4px;padding:4px 2px}
.typing i{width:7px;height:7px;border-radius:50%;background:var(--rose);opacity:.5;animation:blink 1s infinite}
.typing i:nth-child(2){animation-delay:.15s}.typing i:nth-child(3){animation-delay:.3s}
@keyframes blink{0%,100%{opacity:.2}50%{opacity:.9}}
.suggest{display:flex;gap:8px;overflow-x:auto;padding:4px 0 2px;scrollbar-width:none}
.suggest .chip{white-space:nowrap;flex:none}
.composer{flex:none;display:flex;gap:8px;padding:10px 16px 8px;background:var(--porcelain)}
.composer input{flex:1;border:1px solid var(--line);border-radius:999px;padding:12px 16px;font:inherit;background:var(--paper);min-width:0}
.composer button{border:0;border-radius:50%;width:46px;height:46px;background:var(--rose);color:#fff;display:grid;place-items:center;flex:none}
#composerSlot:not(:empty){padding-bottom:84px}

/* check-in */
.lock{border-radius:28px;padding:26px 18px;background:radial-gradient(120% 80% at 50% 0%,#5B3A4A,#231B2B 70%);color:#fff;display:flex;flex-direction:column;align-items:center;gap:6px;min-height:320px}
.lock .clock{font-size:66px;font-weight:300;letter-spacing:-.03em;line-height:1;margin-top:10px;font-variant-numeric:tabular-nums}
.notif{margin-top:auto;width:100%;background:rgba(255,255,255,.9);backdrop-filter:blur(12px);color:var(--ink);border-radius:20px;padding:12px 14px;display:flex;gap:12px;align-items:flex-start;text-align:left;border:0;animation:drop .6s cubic-bezier(.2,.9,.3,1.2) .3s both}
@keyframes drop{from{transform:translateY(-30px);opacity:0}to{transform:none;opacity:1}}
.app-icon{flex:none;width:38px;height:38px}
.faces{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.faces .option{flex-direction:column;text-align:center;padding:18px 8px;gap:6px}
.loop{display:flex;align-items:center;justify-content:space-between;gap:6px;font-size:12px;text-align:center;color:var(--muted)}
.loop div{flex:1;background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:9px 4px}
.loop div.hl{border-color:var(--rose);color:var(--rose-deep);font-weight:500;background:var(--petal)}

/* me */
.list{display:flex;flex-direction:column}
.list .li{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:13px 0;border-top:1px solid var(--line)}
.list .li:first-child{border-top:0}

/* floating tab bar */
.nav{position:absolute;left:16px;right:16px;bottom:14px;z-index:20;display:flex;justify-content:space-around;background:rgba(255,255,255,.82);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border:1px solid rgba(236,228,226,.9);border-radius:26px;padding:6px;box-shadow:0 16px 40px -18px rgba(31,26,36,.35)}
.nav button{border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;font-weight:500;color:var(--muted);padding:7px 10px;border-radius:18px;min-width:66px;transition:background .2s,color .2s}
.nav button[aria-current="page"]{color:var(--rose-deep);background:var(--petal)}
.nav svg{width:22px;height:22px}
.framed .nav{bottom:22px}
#composerSlot{position:relative}


/* compact routine rows + why sheet */
.plist{display:flex;flex-direction:column;gap:6px}
.prow{display:flex;gap:10px;align-items:center;width:100%;text-align:left;background:var(--paper);border:1px solid var(--line);border-radius:17px;padding:6px 10px 6px 6px;box-shadow:var(--shadow);transition:transform .12s}
.prow:active{transform:scale(.985)}
.prow .shot{flex:none;width:42px;height:52px;border-radius:13px;background:radial-gradient(90% 80% at 50% 90%,#F3E2DF,#FBF5F4);display:grid;place-items:end center;padding-bottom:3px;overflow:hidden}
.prow .num{flex:none;width:16px;font-size:12px;color:var(--muted);text-align:center}
.prow .txt{flex:1;min-width:0}
.prow .brand{font-size:11.5px;color:var(--muted);display:flex;gap:6px;align-items:center}
.prow .nm,.prow .ko{display:block}
.prow .nm{font-size:14px;font-weight:600;letter-spacing:-.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.prow .ko{font-size:11.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-family:var(--kr)}
.prow .rt{flex:none;text-align:right;font-size:12px;color:var(--muted)}
.prow .rt b{display:block;font-size:14px;color:var(--ink);font-weight:600;font-variant-numeric:tabular-nums}
.prow .chev{flex:none;color:#C9BDBA;font-size:18px;margin-left:-2px}
.profile-card.compact{padding:12px 16px;gap:7px;border-radius:22px}
.total .save{border:0;background:var(--ink);color:#fff;border-radius:999px;padding:8px 14px;font-size:13px;font-weight:500;margin-left:10px}
.total{padding:11px 12px 11px 16px}
.sheet-wrap{position:absolute;inset:0;z-index:45;display:flex;flex-direction:column;justify-content:flex-end;background:rgba(31,26,36,.32);animation:fade .2s ease both}
@keyframes fade{from{opacity:0}to{opacity:1}}
.sheet{background:var(--paper);border-radius:28px 28px 0 0;padding:10px 20px 26px;display:flex;flex-direction:column;gap:12px;animation:up .32s cubic-bezier(.2,.8,.2,1) both;box-shadow:0 -20px 50px -20px rgba(31,26,36,.4)}
@keyframes up{from{transform:translateY(100%)}to{transform:none}}
.sheet .grab{width:40px;height:4px;border-radius:2px;background:#E2D8D6;align-self:center;margin-bottom:4px}
.sheet .hero{display:flex;gap:16px;align-items:center}
.sheet .hero .shot{width:76px;height:96px;border-radius:20px;background:radial-gradient(90% 80% at 50% 90%,#F3E2DF,#FBF5F4);display:grid;place-items:end center;padding-bottom:5px;flex:none}
.shop{display:flex;flex-direction:column;max-height:46vh;overflow:auto;padding-right:4px}
.shop-row .price{flex:none;font-size:14px}
.shop-row .spacer{min-width:0}
.shop-row{display:flex;align-items:center;gap:10px;padding:9px 2px;border-top:1px solid var(--line);cursor:pointer}
.shop-row:first-child{border-top:0}
.shop-row input{width:20px;height:20px;accent-color:var(--rose);flex:none}
.shop-row .aisle-tag{flex:none;font-size:12px;font-weight:600;background:var(--petal);color:var(--rose-deep);border-radius:8px;padding:3px 7px;min-width:34px;text-align:center}
.shop-row .nm{display:block;font-size:14px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.shop-row .ko{display:block;font-size:12px;color:var(--muted);font-family:var(--kr)}
.shop-row input:checked ~ .spacer .nm{text-decoration:line-through;opacity:.5}
/* compact scan result */
.ing-row{padding:7px 0;align-items:center}
.ing-row .nm{font-size:14px;font-weight:600}
.ing-row .ko{display:inline;margin-left:6px;font-size:11.5px}
.ing-row .desc{font-size:12px;color:var(--muted);text-align:right;max-width:42%;line-height:1.3}
.face-wrap.small{width:100%;aspect-ratio:1.5/1;margin:0 auto;flex:none}
.rescan{border:0;background:none;color:var(--rose);font-size:13px;font-weight:500;padding:0}


/* short phones (iPhone SE and similar): tighter so nothing scrolls */
@media (max-height:780px){
  .hero-art{height:150px;margin-bottom:12px}
  .hero-art .trio{transform:scale(.72);transform-origin:50% 100%;bottom:20px}
  .float-chip{display:none}
  h1{font-size:27px} h2{font-size:22px}
  .screen{padding-top:0}
  .top{min-height:48px;padding-top:6px;padding-bottom:4px}
  .prow{padding:4px 10px 4px 4px} .prow .shot{width:36px;height:44px} .prow .shot svg{width:30px;height:auto}
  .prow .ko{display:none}
  .plist{gap:5px}
  .profile-card.compact{padding:10px 14px}
  .ing-row{padding:4px 0} .ing-row .ko{display:none}
  .verdict{padding:11px 14px}
  .card{padding:12px 14px}
  .stack{gap:10px!important}
  .msg{padding:9px 13px;font-size:14px}
  .me-ads{display:none}
  .btn{padding:14px 18px}
  .consent-row{padding:10px 0}
  .face-wrap{width:78%;margin:0 auto}
  .face-wrap.small{width:100%;aspect-ratio:1.9/1}
}

/* toast + demo panel */
.toast{position:absolute;left:50%;bottom:100px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 18px;border-radius:999px;font-size:14px;z-index:30;max-width:86%;text-align:center;animation:in .25s ease both}
.demo-panel{position:absolute;inset:auto 12px 12px 12px;background:var(--ink);color:#fff;border-radius:22px;padding:14px;z-index:40;display:none;flex-direction:column;gap:8px}
.demo-panel.open{display:flex}
.demo-panel .grid{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.demo-panel button{border:1px solid rgba(255,255,255,.2);background:rgba(255,255,255,.06);color:#fff;border-radius:12px;padding:8px;font-size:13px;text-align:left}
</style>
</head>
<body>
<div class="app" id="app">
  <div class="status" aria-hidden="true">
    <span>9:41</span>
    <span class="icons">
      <svg width="18" height="12" viewBox="0 0 18 12"><rect x="0" y="8" width="3" height="4" rx="1" fill="currentColor"/><rect x="5" y="5" width="3" height="7" rx="1" fill="currentColor"/><rect x="10" y="2.5" width="3" height="9.5" rx="1" fill="currentColor"/><rect x="15" y="0" width="3" height="12" rx="1" fill="currentColor"/></svg>
      <svg width="16" height="12" viewBox="0 0 16 12"><path d="M8 11.5 5.6 9a3.4 3.4 0 0 1 4.8 0L8 11.5Zm-4.2-4.3L2.3 5.7a8 8 0 0 1 11.4 0l-1.5 1.5a5.9 5.9 0 0 0-8.4 0ZM.8 4.2-.6 2.8a12.2 12.2 0 0 1 17.2 0l-1.4 1.4a10.2 10.2 0 0 0-14.4 0Z" fill="currentColor"/></svg>
      <svg width="26" height="12" viewBox="0 0 26 12"><rect x=".5" y=".5" width="22" height="11" rx="3" fill="none" stroke="currentColor" opacity=".4"/><rect x="2" y="2" width="17" height="8" rx="1.6" fill="currentColor"/><rect x="23.5" y="4" width="2" height="4" rx="1" fill="currentColor" opacity=".4"/></svg>
    </span>
  </div>
  <header class="top" id="top"></header>
  <main class="screen" id="screen" tabindex="-1"></main>
  <div id="composerSlot"></div>
  <nav class="nav" id="nav" aria-label="Main"></nav>
  <div class="demo-panel" id="demoPanel" role="dialog" aria-label="Demo controls"></div>
</div>

<script>
/* Pibu brand kit v2: logo mark, wordmark, app icon and glossy product renders.
   Shared by app.html and index.html (inlined at build time). */
(function (g) {
  const C = {
    ink: "#1F1A24", rose: "#A64D66", roseDeep: "#7E3549", blush: "#F2DCD9", petal: "#F9ECEA",
    celadon: "#9BB8AC", celadonDeep: "#4D7466", porcelain: "#F7F3F1"
  };
  let uid = 0;
  const id = p => p + (++uid);

  /* The mark: a dewdrop that is also a rising moon (달). */
  function mark(size = 40, opts = {}) {
    const a = id("pm"), b = id("ph");
    const light = opts.light;
    return `<svg width="${size}" height="${size}" viewBox="0 0 48 48" aria-hidden="true" style="display:block;flex:none">
      <defs>
        <radialGradient id="${a}" cx="35%" cy="30%" r="75%">
          <stop offset="0" stop-color="${light ? "#FFFFFF" : "#F6D9D9"}"/>
          <stop offset=".55" stop-color="${light ? "#F2DCD9" : "#D98A9C"}"/>
          <stop offset="1" stop-color="${light ? "#D9A3AF" : C.roseDeep}"/>
        </radialGradient>
        <linearGradient id="${b}" x1="0" y1="0" x2="1" y2="1">
          <stop offset="0" stop-color="#fff" stop-opacity=".95"/><stop offset="1" stop-color="#fff" stop-opacity="0"/>
        </linearGradient>
      </defs>
      <path d="M24 3c7 9 17 17.5 17 27a17 17 0 0 1-34 0C7 20.5 17 12 24 3Z" fill="url(#${a})"/>
      <path d="M15.5 27c1-6 5.2-11.5 8.5-15-1.8 4.5-3.6 9.6-3.6 15.4 0 3 .7 5.6 1.8 7.6-4.2-1.3-7.3-4.3-6.7-8Z" fill="url(#${b})" opacity=".9"/>
      <circle cx="31.5" cy="33" r="2.1" fill="#fff" opacity=".75"/>
    </svg>`;
  }

  /* Wordmark lockup: mark + "pibu" + 피부 */
  function logo(opts = {}) {
    const s = opts.size || 28, col = opts.color || C.ink, sub = opts.sub !== false;
    return `<span class="pibu-logo" style="display:inline-flex;align-items:center;gap:${s * 0.32}px;color:${col}">
      ${mark(s * 1.25, { light: opts.light })}
      <span style="display:inline-flex;align-items:baseline;gap:${s * 0.28}px">
        <span style="font-family:'Manrope','Noto Sans KR',system-ui,sans-serif;font-weight:700;font-size:${s * 1.12}px;letter-spacing:-.045em;line-height:1">pibu</span>
        ${sub ? `<span style="font-family:'Noto Sans KR','Manrope',sans-serif;font-weight:500;font-size:${s * 0.46}px;opacity:.55;line-height:1">피부</span>` : ""}
      </span></span>`;
  }

  /* App icon: rounded square with the mark. */
  function appIcon(size = 64) {
    const a = id("ai");
    return `<svg width="${size}" height="${size}" viewBox="0 0 64 64" aria-hidden="true" style="display:block;flex:none">
      <defs><linearGradient id="${a}" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#2A2230"/><stop offset="1" stop-color="${C.ink}"/></linearGradient></defs>
      <rect width="64" height="64" rx="15" fill="url(#${a})"/>
      <g transform="translate(14 13) scale(.75)">${mark(48, { light: true }).replace(/^<svg[^>]*>|<\/svg>$/g, "")}</g>
    </svg>`;
  }

  /* Glossy product render. shape: bottle | dropper | jar | tube | pump */
  function product(p = {}, w = 60) {
    const shape = p.shape || "bottle", base = p.color || C.blush, cap = p.cap || "rosegold";
    const h = Math.round(w * 1.6);
    const gb = id("gb"), gc = id("gc"), gs = id("gs"), gl = id("gl");
    const capFill = cap === "ink" ? `url(#${gc}i)` : `url(#${gc})`;
    const defs = `<defs>
      <linearGradient id="${gb}" x1="0" x2="1"><stop offset="0" stop-color="${shade(base, -10)}"/><stop offset=".22" stop-color="${shade(base, 14)}"/><stop offset=".5" stop-color="${base}"/><stop offset=".85" stop-color="${shade(base, -16)}"/><stop offset="1" stop-color="${shade(base, -26)}"/></linearGradient>
      <linearGradient id="${gc}" x1="0" x2="1"><stop offset="0" stop-color="#8E6A62"/><stop offset=".3" stop-color="#E7C9BF"/><stop offset=".55" stop-color="#B98E84"/><stop offset="1" stop-color="#7A5850"/></linearGradient>
      <linearGradient id="${gc}i" x1="0" x2="1"><stop offset="0" stop-color="#0E0B10"/><stop offset=".35" stop-color="#4A4150"/><stop offset="1" stop-color="#120E15"/></linearGradient>
      <linearGradient id="${gl}" x1="0" x2="1"><stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset=".5" stop-color="#fff" stop-opacity=".55"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient>
      <radialGradient id="${gs}"><stop offset="0" stop-color="#1F1A24" stop-opacity=".28"/><stop offset="1" stop-color="#1F1A24" stop-opacity="0"/></radialGradient>
    </defs>`;
    const shadow = `<ellipse cx="50" cy="157" rx="40" ry="5" fill="url(#${gs})"/>`;
    const label = (y, hh) => `<rect x="24" y="${y}" width="52" height="${hh}" rx="3" fill="#fff" opacity=".82"/>
      <rect x="31" y="${y + hh * 0.28}" width="38" height="3.2" rx="1.6" fill="${C.ink}" opacity=".75"/>
      <rect x="35" y="${y + hh * 0.5}" width="30" height="2" rx="1" fill="${C.ink}" opacity=".3"/>
      <rect x="38" y="${y + hh * 0.66}" width="24" height="2" rx="1" fill="${C.ink}" opacity=".3"/>`;
    let body = "";
    if (shape === "bottle") body = `<rect x="38" y="6" width="24" height="26" rx="4" fill="${capFill}"/><rect x="34" y="30" width="32" height="6" rx="2" fill="${shade(base, -30)}"/>
      <path d="M22 44c0-6 6-9 12-9h32c6 0 12 3 12 9v100a10 10 0 0 1-10 10H32a10 10 0 0 1-10-10Z" fill="url(#${gb})"/>${label(82, 40)}
      <rect x="28" y="44" width="7" height="100" rx="3.5" fill="url(#${gl})"/>`;
    if (shape === "dropper") body = `<ellipse cx="50" cy="12" rx="11" ry="10" fill="${C.ink}" opacity=".9"/><rect x="40" y="18" width="20" height="22" rx="3" fill="${capFill}"/>
      <path d="M26 50c0-6 5-10 11-10h26c6 0 11 4 11 10v94a10 10 0 0 1-10 10H36a10 10 0 0 1-10-10Z" fill="url(#${gb})"/>${label(84, 38)}
      <rect x="31" y="50" width="6" height="94" rx="3" fill="url(#${gl})"/>`;
    if (shape === "jar") body = `<rect x="16" y="78" width="68" height="20" rx="5" fill="${capFill}"/>
      <path d="M14 104c0-4 3-6 7-6h58c4 0 7 2 7 6v38a12 12 0 0 1-12 12H26a12 12 0 0 1-12-12Z" fill="url(#${gb})"/>${label(112, 30)}
      <rect x="20" y="104" width="7" height="40" rx="3.5" fill="url(#${gl})"/>`;
    if (shape === "tube") body = `<rect x="36" y="128" width="28" height="26" rx="4" fill="${capFill}"/>
      <path d="M24 10h52l-6 120H30Z" fill="url(#${gb})"/><rect x="24" y="8" width="52" height="7" rx="2" fill="${shade(base, -22)}"/>${label(46, 44)}
      <rect x="30" y="16" width="6" height="110" rx="3" fill="url(#${gl})"/>`;
    if (shape === "pump") body = `<rect x="44" y="4" width="12" height="20" rx="3" fill="${capFill}"/><rect x="50" y="8" width="22" height="7" rx="3" fill="${capFill}"/><rect x="36" y="22" width="28" height="12" rx="3" fill="${capFill}"/>
      <rect x="22" y="34" width="56" height="120" rx="14" fill="url(#${gb})"/>${label(78, 42)}
      <rect x="28" y="40" width="7" height="108" rx="3.5" fill="url(#${gl})"/>`;
    return `<svg class="product-render" width="${w}" height="${h}" viewBox="0 0 100 162" aria-hidden="true" style="display:block;flex:none;overflow:visible">${defs}${shadow}${body}</svg>`;
  }


  /* Line icon set, 24px grid, drawn in the brand stroke. */
  const ICONS = {
    globe:'<circle cx="12" cy="12" r="9"/><ellipse cx="12" cy="12" rx="4" ry="9"/><path d="M3 12h18M5 7h14M5 17h14"/>',
    ship:'<path d="M3 15h18l-2.5 5h-13z"/><path d="M6 15V9h12v6M9 9V5h6v4"/><path d="M2 21c2 0 2-1 4-1s2 1 4 1 2-1 4-1 2 1 4 1 2-1 4-1"/>',
    medal:'<circle cx="12" cy="15" r="5.5"/><path d="M8.5 3.5l2.5 7M15.5 3.5l-2.5 7M7 3.5h10"/><path d="M12 12.5l.9 1.8 2 .3-1.4 1.4.3 2-1.8-.9-1.8.9.3-2-1.4-1.4 2-.3z"/>',
    coins:'<ellipse cx="9" cy="6.5" rx="6" ry="2.5"/><path d="M3 6.5v4c0 1.4 2.7 2.5 6 2.5s6-1.1 6-2.5v-4"/><path d="M9 13v4c0 1.4 2.7 2.5 6 2.5s6-1.1 6-2.5v-4c0-1.4-2.7-2.5-6-2.5"/>',
    people:'<circle cx="9" cy="8" r="3.2"/><path d="M3 20c.6-3.4 3-5.5 6-5.5s5.4 2.1 6 5.5"/><circle cx="17" cy="9" r="2.6"/><path d="M15.5 14.6c2.6-.3 4.8 1.4 5.5 4.4"/>',
    trend:'<path d="M3 17l6-6 4 4 8-8"/><path d="M15 7h6v6"/>',
    chip:'<rect x="6" y="6" width="12" height="12" rx="2"/><rect x="9.5" y="9.5" width="5" height="5" rx="1"/><path d="M9 3v3M15 3v3M9 18v3M15 18v3M3 9h3M3 15h3M18 9h3M18 15h3"/>',
    server:'<rect x="4" y="3" width="16" height="7" rx="2"/><rect x="4" y="14" width="16" height="7" rx="2"/><path d="M8 6.5h.01M8 17.5h.01M12 6.5h5M12 17.5h5"/>',
    car:'<path d="M3 16v-3l2-5h14l2 5v3"/><path d="M3 16h18v2H3z"/><circle cx="7.5" cy="18" r="1.8"/><circle cx="16.5" cy="18" r="1.8"/><path d="M6 12h12"/>',
    bottle:'<rect x="9.5" y="2.5" width="5" height="4" rx="1"/><path d="M8 9.5a2.5 2.5 0 0 1 2.5-2.5h3A2.5 2.5 0 0 1 16 9.5V19a2.5 2.5 0 0 1-2.5 2.5h-3A2.5 2.5 0 0 1 8 19z"/><path d="M8 13h8"/>',
    sparkle:'<path d="M12 3l1.8 5.2L19 10l-5.2 1.8L12 17l-1.8-5.2L5 10l5.2-1.8z"/><path d="M19 15l.7 2 2 .7-2 .7-.7 2-.7-2-2-.7 2-.7z"/>',
    phone:'<rect x="6.5" y="2.5" width="11" height="19" rx="2.5"/><path d="M10.5 18.5h3"/>',
    chat:'<path d="M4 5h16v11H10l-5 4v-4H4z"/><path d="M8 9.5h8M8 12.5h5"/>',
    user:'<circle cx="12" cy="8" r="4"/><path d="M4 21c.8-4.2 4-7 8-7s7.2 2.8 8 7"/>',
    store:'<path d="M3 9l1.5-5h15L21 9"/><path d="M3 9c0 1.7 1.3 3 3 3s3-1.3 3-3c0 1.7 1.3 3 3 3s3-1.3 3-3c0 1.7 1.3 3 3 3s3-1.3 3-3"/><path d="M5 12v9h14v-9M10 21v-5h4v5"/>',
    megaphone:'<path d="M3 10v4h3l8 5V5L6 10z"/><path d="M17 9.5a3.5 3.5 0 0 1 0 5M7 14l1.5 6h2.5l-1-5"/>',
    star:'<path d="M12 3l2.8 5.7 6.2.9-4.5 4.4 1 6.2L12 17.3 6.5 20.2l1-6.2L3 9.6l6.2-.9z"/>',
    chart:'<path d="M4 20h16"/><rect x="5.5" y="11" width="3" height="7" rx="1"/><rect x="10.5" y="7" width="3" height="11" rx="1"/><rect x="15.5" y="4" width="3" height="14" rx="1"/>',
    shield:'<path d="M12 3l8 3v6c0 4.5-3.4 8.2-8 9-4.6-.8-8-4.5-8-9V6z"/><path d="M8.5 12l2.5 2.5 4.5-5"/>',
    lock:'<rect x="5" y="10.5" width="14" height="10" rx="2.5"/><path d="M8 10.5V7.5a4 4 0 0 1 8 0v3M12 14.5v2.5"/>',
    scale:'<path d="M12 3v18M7 21h10M5 7h14M12 5V3"/><path d="M5 7l-3 6a3 3 0 0 0 6 0zM19 7l-3 6a3 3 0 0 0 6 0z"/>',
    eye:'<path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3.2"/>',
    loop:'<path d="M20 11a8 8 0 0 0-14.3-4.6L4 8"/><path d="M4 3.5V8h4.5"/><path d="M4 13a8 8 0 0 0 14.3 4.6L20 16"/><path d="M20 20.5V16h-4.5"/>',
    camera:'<path d="M3 8.5A2.5 2.5 0 0 1 5.5 6h2l1.5-2h6l1.5 2h2A2.5 2.5 0 0 1 21 8.5v9a2.5 2.5 0 0 1-2.5 2.5h-13A2.5 2.5 0 0 1 3 17.5z"/><circle cx="12" cy="13" r="3.8"/>',
    vote:'<path d="M4 13h16v8H4z"/><path d="M8 13V4h8v9"/><path d="M10 8.5l1.5 1.5 3-3"/>',
    won:'<path d="M3.5 5l3.5 14 5-12 5 12 3.5-14"/><path d="M3 10h18M3 14h18"/>',
    target:'<circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="5"/><circle cx="12" cy="12" r="1.5"/>',
    pin:'<path d="M12 21s-7-6.2-7-11.5a7 7 0 0 1 14 0C19 14.8 12 21 12 21z"/><circle cx="12" cy="9.5" r="2.6"/>',
    tag:'<path d="M3 12V4h8l10 10-8 8z"/><circle cx="7.5" cy="8.5" r="1.4"/>',
    book:'<path d="M4 4.5A1.5 1.5 0 0 1 5.5 3H20v16H5.5A1.5 1.5 0 0 0 4 20.5z"/><path d="M4 20.5A1.5 1.5 0 0 0 5.5 22H20M8 7h8"/>',
    cut:'<path d="M3 17l6-6 4 4 8-8" transform="scale(1,-1) translate(0,-24)"/><path d="M15 17h6v-6"/>',
    leaf:'<path d="M5 19C5 10 10 4 20 4c0 10-6 15-15 15z"/><path d="M5 19l8-8"/>',
    gift:'<rect x="3" y="8" width="18" height="4" rx="1"/><path d="M5 12v9h14v-9M12 8v13M12 8c-2-4-6-4-6-1.5S9 8 12 8zM12 8c2-4 6-4 6-1.5S15 8 12 8z"/>',
    question:'<circle cx="12" cy="12" r="9"/><path d="M9.5 9.5a2.5 2.5 0 1 1 3.5 2.3c-.6.3-1 .9-1 1.7v.5M12 17h.01"/>'
  };
  function icon(name, size = 24) {
    const d = ICONS[name]; if (!d) return "";
    return `<svg class="pibu-icon" width="${size}" height="${size}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${d.replace(/<(path|circle|ellipse|rect)/g,'<$1 pathLength="1"')}</svg>`;
  }

  function shade(hex, pct) {
    const n = parseInt(hex.slice(1), 16); let r = n >> 16, gg = (n >> 8) & 255, b = n & 255;
    const f = pct / 100;
    const t = v => Math.max(0, Math.min(255, Math.round(f >= 0 ? v + (255 - v) * f : v * (1 + f))));
    return "#" + [t(r), t(gg), t(b)].map(v => v.toString(16).padStart(2, "0")).join("");
  }


  /* Glossy illustrations in the product-render style (160x160). kind: medal | coins | people | sprout */
  function illo(kind, w = 150) {
    const u = id("il"), RG = `${u}rg`, BL = `${u}bl`, CE = `${u}ce`, GL = `${u}gl`, SH = `${u}sh`, IN = `${u}in`;
    const defs = `<defs>
      <linearGradient id="${RG}" x1="0" x2="1"><stop offset="0" stop-color="#8E6A62"/><stop offset=".3" stop-color="#EBD0C6"/><stop offset=".55" stop-color="#C29A8F"/><stop offset="1" stop-color="#7A5850"/></linearGradient>
      <linearGradient id="${BL}" x1="0" x2="1"><stop offset="0" stop-color="${shade(C.blush,-12)}"/><stop offset=".25" stop-color="${shade(C.blush,14)}"/><stop offset=".55" stop-color="${C.blush}"/><stop offset="1" stop-color="${shade(C.blush,-26)}"/></linearGradient>
      <linearGradient id="${CE}" x1="0" x2="1"><stop offset="0" stop-color="#A9C4B8"/><stop offset=".3" stop-color="#E4EFE9"/><stop offset=".6" stop-color="#C3D8CE"/><stop offset="1" stop-color="#8FAE9F"/></linearGradient>
      <linearGradient id="${IN}" x1="0" x2="1"><stop offset="0" stop-color="#A64D66"/><stop offset=".35" stop-color="#D68A9D"/><stop offset="1" stop-color="#7E3549"/></linearGradient>
      <linearGradient id="${GL}" x1="0" x2="1"><stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset=".5" stop-color="#fff" stop-opacity=".6"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient>

/* ============ derived profile + routine ============ */
function profile(){
  const a=S.answers, tags=[];
  const type={a:"Oily",b:"Combination",c:"Dry",d:"Normal"}[a.feel] || "Combination";
  const typeJa={Oily:"脂性肌",Combination:"混合肌",Dry:"乾燥肌",Normal:"普通肌"}[type];
  const sens = a.sens==="a" || a.sens==="b";
  const main = S.lang==="ja" ? typeJa + (sens?"・敏感寄り":"") : type + (sens?", sensitive-leaning":"");
  (a.concerns.length?a.concerns:["redness","pores"]).forEach(c=>tags.push(T[S.lang].concerns[c]));
  if(S.photo==="done") tags.push(S.lang==="ja"?"写真あり":"Photo-checked");
  return {type, sens, main, tags};
}
function routine(){
  const a=S.answers, pr=profile(), c=a.concerns.length?a.concerns:["redness","pores"];
  const low = a.budget==="a", five = a.steps!=="a";
  const cleanser = low? P.cleanserRice : P.cleanserGel;
  const toner = c.includes("redness")||pr.sens ? P.tonerCica : c.includes("acne")||c.includes("pores") ? P.tonerBHA : P.tonerHydra;
  const serum = pr.sens||c.includes("dryness") ? P.serumPanth : P.serumNia;
  const cream = pr.type==="Dry"||(pr.sens&&pr.type!=="Oily") ? P.creamCer : P.creamGel;
  let am, pm;
  if(five){ am=[cleanser,toner,serum,cream,P.sun]; pm=[cleanser,toner,(pr.sens?P.serumPanth:P.serumNia),cream]; }
  else { am=[cleanser,cream,P.sun]; pm=[cleanser,toner,cream]; }
  if(S.checkinSwap){ const sw=x=>x===P.tonerCica||x===P.tonerBHA?P.tonerHydra:x; am=am.map(sw); pm=pm.map(sw); }
  if(!S.consent.ads){ am=am.map(x=>x.ad?{...x,ad:false,brand:"Ondo",name:"Daily Sun Cream SPF50+",ko:"온도 데일리 선크림",price:15500}:x); }
  const uniq=[...new Set([...am,...pm])];
  return {am, pm, total: uniq.reduce((s,p)=>s+p.price,0)};
}

  if(st!=="done") return `<div class="stack" style="gap:14px"><h2>${t("scanTitle")}</h2><p class="muted">${st==="scanning"?t("scanning"):t("scanBody")}</p>${label}
      ${st==="idle"?`<div class="actions"><button class="btn green" data-act="scan">${t("scanBtn")}</button></div>`:""}</div>`;
  const ja=S.lang==="ja";
  const rows=[
    ["ok",ja?"ツボクサエキス（70%）":"Centella asiatica extract (70%)","병풀추출물",ja?"赤みを鎮める":"Calms redness"],
    ["neutral",ja?"精製水":"Water","정제수",ja?"ベース":"Base"],
    ["neutral",ja?"BG（ブチレングリコール）":"Butylene glycol","부틸렌글라이콜",ja?"保湿のベース":"Hydrating base"],
    ["ok",ja?"ナイアシンアミド":"Niacinamide","나이아신아마이드",ja?"毛穴・くすみ":"Pores and dullness"],
    ["ok",ja?"パンテノール":"Panthenol","판테놀",ja?"バリアを修復":"Repairs barrier"],
    ["ok",ja?"マデカソシド":"Madecassoside","마데카소사이드",ja?"鎮静":"Calming"],
    ["neutral",ja?"グリセリン":"Glycerin","글리세린",ja?"保湿":"Moisture"],
    [sens?"warn":"neutral",ja?"香料":"Fragrance","향료",sens?(ja?"敏感肌は刺激になることも":"Can irritate sensitive skin"):(ja?"香り付け":"Scent")]
  ];
  return `<div class="stack" style="gap:10px">
    <div class="row"><h2 class="spacer">${t("ingTitle")}</h2><span class="tag ai">AI</span></div>
    <div class="card" style="padding:12px 16px"><div class="row"><span class="small muted spacer">Moa · ${ja?"シカ カーミング トナー":"Cica Calming Toner"} · 200 ml</span><button class="rescan" data-act="rescan">${t("rescan")}</button></div>
      <div class="ing-list" style="margin-top:4px">${rows.map((r,i)=>`<div class="ing-row" style="animation-delay:${i*70}ms"><span class="mark ${r[0]}">${r[0]==="ok"?"✓":r[0]==="warn"?"!":"·"}</span><div class="spacer"><span class="nm">${r[1]}</span><span class="ko">${r[2]}</span></div><span class="desc">${r[3]}</span></div>`).join("")}</div></div>
    <div class="verdict ${sens?"warn":"ok"}"><b>${sens?(ja?"ほぼ合っています。香料に注意":"Mostly a good match. Watch the fragrance."):(ja?"あなたの肌に合っています":"Good match for your skin")}</b>
      <span class="small">${sens?(ja?"ヒリヒリしやすいとのことなので、耳の後ろで24時間パッチテストをしてください。":"You said new products often sting, so patch-test behind your ear for 24 hours first."):(ja?"赤みと毛穴の悩みに合う成分です。":"Ingredients target your redness and pores.")}</span></div>
    <div class="actions" style="padding-top:0"><button class="btn green" data-go="routine">${t("addRoutine")}</button></div></div>`;
},
chat(){
  if(!S.chat.length) S.chat=[{who:"ai",text:t("chatHello")}];
  return `<div class="stack" style="gap:12px"><h2>${t("chatTitle")}</h2>
    <div class="chat" id="chatlog">${S.chat.map(msgHTML).join("")}</div></div>`;
},
checkin(){
  if(S.checkin==="lock") return `<div class="stack" style="gap:14px"><h2>${t("checkTitle")}</h2>
    <div class="lock"><span class="small" style="opacity:.75">${S.lang==="ja"?"12月2日 火曜日":"Tuesday, 2 December"}</span><span class="clock">8:12</span>
      <button class="notif" data-act="openCheckin"><span class="app-icon">${PibuBrand.appIcon(38)}</span><span class="spacer"><span class="row small"><b>pibu</b><span class="spacer"></span><span class="muted">${t("now")}</span></span><span style="font-size:14px">${t("checkNotif")}</span></span></button></div></div>`;
  if(S.checkin==="ask") return `<div class="stack" style="gap:16px"><h2>${t("checkQ")}</h2>
    <div class="faces">
      <button class="option" data-feel="better" aria-pressed="${S.feeling==="better"}"><span style="font-size:28px">◡</span><b>${t("better")}</b></button>
      <button class="option" data-feel="same" aria-pressed="${S.feeling==="same"}"><span style="font-size:28px">—</span><b>${t("same")}</b></button>
      <button class="option" data-feel="worse" aria-pressed="${S.feeling==="worse"}"><span style="font-size:28px">◠</span><b>${t("worse")}</b></button>
    </div>
    <p class="small muted">${S.lang==="ja"?"任意：新しい写真を追加すると、変化を比べられます。":"Optional: add a new photo so we can compare."}</p>
    <div class="actions"><button class="btn green" data-act="submitCheckin" ${S.feeling?"":"disabled"}>${t("continue")}</button></div></div>`;
  const worse=S.feeling==="worse";
  return `<div class="stack" style="gap:16px"><h2>${t("checkDone")}</h2>
    <div class="loop"><div>${t("checkLoop1")}</div><span aria-hidden="true">→</span><div>${t("checkLoop2")}</div><span aria-hidden="true">→</span><div class="hl">${t("checkLoop3")}</div></div>
    <div class="verdict ${worse?"warn":"ok"}"><b>${t("swapped")}</b><span class="small">${worse?t("worseBody"):t("swappedBody")}</span></div>
    <div class="actions"><button class="btn green" data-act="seeUpdated">${S.lang==="ja"?"新しいルーティンを見る":"See updated routine"}</button></div></div>`;
},
me(){
  const pr=profile();
  return `<div class="stack" style="gap:16px"><h2>${t("meTitle")}</h2>
    <div class="card"><span class="small muted">${t("meProfile")}</span><div style="font-family:var(--display);font-size:22px;font-weight:500">${pr.main}</div><div class="small muted">${pr.tags.join(", ")}</div></div>
    <div class="card"><b>${t("mePrivacy")}</b><div class="list" style="margin-top:6px">
      <div class="li"><span>${t("photoStatus")}</span><span class="tag green">✓ ${t("deleted")}</span></div>
      <div class="li"><span>${t("dataUse")}</span><span class="small muted">${S.consent.improve?t("on"):t("off")}</span></div>
      <div class="li"><button class="btn text" style="padding:0;color:var(--bad)" data-act="deleteAll">${t("deleteAll")}</button></div></div></div>
    <div class="card small me-ads"><b>${t("meAds")}</b><p class="muted" style="margin-top:4px">${t("meAdsBody")}</p></div>
    <div class="actions"><button class="btn ghost" data-act="simulate">${t("simulate")}</button></div></div>`;
}
};

function msgHTML(m){
  if(m.who==="me") return `<div class="msg me">${esc(m.text)}</div>`;
  if(m.typing) return `<div class="msg ai"><span class="typing" aria-label="typing"><i></i><i></i><i></i></span></div>`;
  return `<div class="msg ai">${m.label!==false?`<span class="tag ai" style="align-self:flex-start">${t("aiLabel")}</span>`:""}<span>${m.text}</span>${m.src?`<span class="src">${m.src}</span>`:""}</div>`;
}
const QA = () => S.lang==="ja" ? [
  {q:"この化粧水とレチノールは一緒に使える？", a:"使えますが、同じ夜には重ねないでください。シカ化粧水は朝と夜、レチノールは週2〜3回の夜だけにしましょう。ヒリヒリしやすい肌なので、まずは週1回から。", src:"出典：確認済み成分データベース（ツボクサ、レチノール）"},
  {q:"日焼け止めはメイク下地にできる？", a:"はい。Dalbit マイルドサンフルイドは軽いテクスチャーで、1〜2分なじませてからファンデーションを塗れば崩れにくいです。", src:"出典：商品の技術資料 · 広告商品"},
  {q:"₩30,000しかないなら何を先に買う？", a:"日焼け止め（₩17,000）とジェルクレンザー（₩13,000）でちょうど₩30,000です。赤みには、まず刺激を減らして紫外線を防ぐことがいちばん効きます。", src:"出典：あなたのルーティンと店頭価格"}
] : [
  {q:"Can I use this toner with retinol?", a:"Yes, but not in the same layer on the same night at first. Use the cica toner morning and evening, and retinol only 2–3 evenings a week. Your skin stings easily, so start with once a week.", src:"Source: checked ingredient database (centella, retinol)"},
  {q:"Is the sunscreen OK under makeup?", a:"Yes. The Dalbit Mild Sun Fluid is light. Wait 1–2 minutes before foundation and it won't pill.", src:"Source: product technical sheet · this product is an Ad"},
  {q:"I only have ₩30,000. What do I buy first?", a:"Sunscreen (₩17,000) and the gel cleanser (₩13,000), exactly ₩30,000. For redness, protecting from sun and washing gently help most.", src:"Source: your routine and store prices"}
];
function ask(text, qa){
  S.chat.push({who:"me",text}); S.chat.push({who:"ai",typing:true}); refreshChat();
  later(()=>{ S.chat.pop(); S.chat.push(qa?{who:"ai",text:qa.a,src:qa.src}:{who:"ai",text:t("fallback"),label:false}); refreshChat(); }, 1300);
}
function refreshChat(){ const l=$("chatlog"); if(!l) return; l.innerHTML=S.chat.map(msgHTML).join(""); renderSuggest(); const s=$("screen"); s.scrollTop=s.scrollHeight; }
function renderSuggest(){
  const slot=$("composerSlot"); if(S.screen!=="chat"){slot.innerHTML="";return;}
  const asked=S.chat.filter(m=>m.who==="me").map(m=>m.text);
  const left=QA().filter(x=>!asked.includes(x.q));
  slot.innerHTML=`<div style="padding:0 16px">${left.length?`<div class="suggest">${left.map(x=>`<button class="chip" data-q="${esc(x.q)}">${esc(x.q)}</button>`).join("")}</div>`:""}</div>
   <form class="composer" id="composer"><input id="chatIn" autocomplete="off" placeholder="${t("placeholder")}" aria-label="${t("placeholder")}"><button aria-label="Send"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M5 12h14M13 6l6 6-6 6"/></svg></button></form>`;
  $("composer").onsubmit=e=>{e.preventDefault(); const v=$("chatIn").value.trim(); if(!v) return; const m=QA().find(x=>x.q.toLowerCase()===v.toLowerCase()); ask(v,m);};
}

const after = {
  welcome(){},
  analyzing(){
    const steps=[t("an1"),t("an2"),t("an3"),t("an4")];
    steps.forEach((s,i)=>later(()=>{ const l=$("log"); if(l) l.insertAdjacentHTML("beforeend",`<div>✓ ${s}</div>`); }, 350+i*550));
    later(()=>go("routine"), 350+steps.length*550+300);
  },
  photo(){ if(S.photo==="scanning") later(()=>{ S.photo=S.photoNext; render(); }, 2200); },
  scan(){ if(S.scan==="scanning") later(()=>{ S.scan="done"; render(); }, 1500); },
  chat(){ renderSuggest(); }
};

/* little illustrated shelf for the welcome screen */
function drawShelf(){
  const c=$("shelf"); if(!c) return; const r=c.getBoundingClientRect(), dpr=window.devicePixelRatio||1;
  c.width=r.width*dpr; c.height=r.height*dpr; const g=c.getContext("2d"); g.scale(dpr,dpr);
  const W=r.width,H=r.height, cols=["#9FCDB9","#F4DFC8","#D9E6F2","#EBD3DC","#F6E9B8","#CFE6DE","#BFD3EA","#EFE6DA","#F7D6DE"];
  g.fillStyle="#E6ECE9"; g.fillRect(0,0,W,H);
  let seed=7; const rnd=()=>{seed=(seed*16807)%2147483647; return seed/2147483647;};
  const rows=3, rowH=H/rows;
  for(let ry=0;ry<rows;ry++){
    const base=(ry+1)*rowH-10; g.fillStyle="#C9D3CF"; g.fillRect(0,base,W,10);
    let x=8; while(x<W){ const w=16+rnd()*16, h=rowH*(.45+rnd()*.4), col=cols[Math.floor(rnd()*cols.length)];
      g.fillStyle=col; const rr=Math.min(6,w/3); g.beginPath(); g.roundRect?g.roundRect(x,base-h,w,h,[rr,rr,2,2]):g.rect(x,base-h,w,h); g.fill();
      g.fillStyle="rgba(23,32,45,.78)"; g.fillRect(x+w*.3,base-h-6,w*.4,6);
      g.fillStyle="rgba(23,32,45,.18)"; g.fillRect(x+3,base-h*.45,w-6,2.5);
      x+=w+4; }
  }
  // the one product that is "yours"
  const hx=W*.62, hy=rowH*2-10; g.strokeStyle="#1E7A62"; g.lineWidth=3; g.beginPath(); g.arc(hx,hy-rowH*.32,rowH*.42,0,Math.PI*2); g.stroke();
  g.fillStyle="#1E7A62"; g.beginPath(); g.roundRect?g.roundRect(hx-44,hy-rowH*.32-rowH*.42-30,88,24,12):g.rect(hx-44,hy-rowH*.74-30,88,24); g.fill();
  g.fillStyle="#fff"; g.font="600 12px 'IBM Plex Sans KR', sans-serif"; g.textAlign="center"; g.fillText(S.lang==="ja"?"あなたの一本":"Yours",hx,hy-rowH*.32-rowH*.42-13);
}

/* ============ events ============ */
document.addEventListener("click", e=>{
  const b=e.target.closest("button"); if(!b) return;
  const d=b.dataset;
  if(d.go){ if(d.go==="routine" && !S.answers.feel) fillDemo(); go(d.go); return; }
  if(d.lang){ S.lang=d.lang; render(); return; }
  if(d.consent){ S.consent[d.consent]=!S.consent[d.consent]; b.setAttribute("aria-checked",S.consent[d.consent]); return; }
  if(d.ans){ const k=d.ans,v=d.val; if(k==="concerns"){ const a=S.answers.concerns; const i=a.indexOf(v); if(i>=0)a.splice(i,1); else if(a.length<3)a.push(v); } else S.answers[k]=v; render(); return; }
  if(d.tab){ S.tab=d.tab; S.open=null; render(); return; }
  if(d.why){ openSheet(d.why); return; }
  if("closeSheet" in d){ const w=document.querySelector(".sheet-wrap"); if(w) w.remove(); return; }
  if(d.q){ const qa=QA().find(x=>x.q===d.q); ask(d.q,qa); return; }
  if(d.feel){ S.feeling=d.feel; render(); return; }
  const act=d.act; if(!act) return;
  ({
    toggleLang(){ S.lang=S.lang==="en"?"ja":"en"; render(); },
    demoOnly(){ toast(t("demoOnly")); },
    back(){ const order=["welcome","consent","photo","quiz"]; if(S.screen==="quiz"&&S.q>0){S.q--;render();return;} if(S.screen==="checkin"){go("me");return;} const i=order.indexOf(S.screen); go(order[Math.max(0,i-1)]); },
    consentNext(){ if(S.consent.photo){ S.photo="idle"; go("photo"); } else { S.q=0; go("quiz"); } },
    skipPhoto(){ S.consent.photo=false; S.q=0; go("quiz"); },
    demoPhoto(){ S.photo="scanning"; S.photoNext="done"; render(); },
    blurryPhoto(){ S.photo="scanning"; S.photoNext="blurry"; render(); },
    toQuiz(){ S.q=0; go("quiz"); },
    quizNext(){ if(S.q<4){ S.q++; render(true); } else go("analyzing"); },
    demoAnswers(){ fillDemo(); S.q=4; render(); },
    save(){ openListSheet(); },
    scan(){ S.scan="scanning"; render(); },
    rescan(){ S.scan="idle"; render(); },
    openCheckin(){ S.checkin="ask"; render(); },
    submitCheckin(){ S.checkin="done"; render(); },
    seeUpdated(){ S.checkinSwap=true; S.tab="am"; go("routine"); },
    simulate(){ S.checkin="lock"; S.feeling=null; go("checkin"); },
    deleteAll(){ const l=S.lang; S=fresh(); S.lang=l; render(); toast(t("deletedAll")); }
  })[act]?.();
});
function openListSheet(){
  const r=routine(), items=[...new Set([...r.am,...r.pm])].sort((a,b)=>a.aisle.localeCompare(b.aisle));
  const ja=S.lang==="ja";
  const old=document.querySelector(".sheet-wrap"); if(old) old.remove();
  const w=document.createElement("div"); w.className="sheet-wrap";
  w.innerHTML=`<div class="sheet" role="dialog" aria-label="${ja?"買い物リスト":"Shopping list"}"><span class="grab"></span>
    <div class="row"><span class="tag green">✓ ${t("saved")}</span><span class="spacer"></span><span class="small muted">${items.length} ${ja?"点":"items"}</span></div>
    <div><div style="font-weight:600;font-size:20px;letter-spacing:-.02em">${ja?"買い物リスト":"Your shopping list"}</div>
      <div class="small muted">${ja?"売り場順。店員さんに韓国語名を見せてください。":"Sorted by aisle. Show the Korean names to staff if you need help."}</div></div>
    <div class="shop">${items.map(p=>`<label class="shop-row"><input type="checkbox"><span class="aisle-tag">${p.aisle}</span><span class="spacer"><span class="nm">${p.name}</span><span class="ko">${p.ko}</span></span><b class="price">${fmtKRW(p.price)}</b></label>`).join("")}</div>
    <div class="total" style="padding:12px 16px"><span>${t("total")}</span><span class="spacer"></span><b class="price">${fmtKRW(r.total)}</b><span class="small muted" style="margin-left:8px">${approx(r.total)}</span></div>
    <button class="btn" data-close-sheet>${ja?"閉じる":"Done"}</button></div>`;
  w.addEventListener("click",e=>{ if(e.target===w) w.remove(); });
  $("app").appendChild(w);
}
function openSheet(id){
  const r=routine(), list=id.startsWith("am")?r.am:r.pm, p=list[+id.slice(2)]; if(!p) return;
  const old=document.querySelector(".sheet-wrap"); if(old) old.remove();
  const w=document.createElement("div"); w.className="sheet-wrap";
  w.innerHTML=`<div class="sheet" role="dialog" aria-label="${esc(p.name)}"><span class="grab"></span>
    <div class="hero"><span class="shot">${PibuBrand.product({shape:p.shape,color:p.color,cap:p.cap},54)}</span>
      <div class="spacer"><div class="small muted" style="display:flex;gap:6px;align-items:center">${p.brand}${p.ad?`<span class="tag ad">Ad</span>`:""}</div><div style="font-weight:600;font-size:17px;line-height:1.25">${p.name}</div><div class="small muted" style="font-family:var(--kr)">${p.ko}</div>
      <div class="row" style="margin-top:6px"><b class="price">${fmtKRW(p.price)}</b><span class="small muted">${approx(p.price)} · ${t("aisle")} ${p.aisle}</span></div></div></div>
    <div class="why-box"><b style="font-weight:600;color:var(--rose-deep)">${t("whyThis")}</b><span>${p.why[S.lang]||p.why.en}</span>${p.ad?`<span class="muted">${t("adWhy")}</span>`:""}<span class="muted small">${t("source")}</span></div>
    <button class="btn" data-close-sheet>${t("hide")}</button></div>`;
  w.addEventListener("click",e=>{ if(e.target===w) w.remove(); });
  $("app").appendChild(w);
}
function fillDemo(){ S.answers={feel:"b",concerns:["redness","pores"],sens:"b",budget:"b",steps:"b"}; }
function toast(msg){ const el=document.createElement("div"); el.className="toast"; el.setAttribute("role","status"); el.textContent=msg; $("app").appendChild(el); setTimeout(()=>el.remove(),2200); }

/* ============ demo controls (triple-tap logo, key D, or messages from the slides) ============ */
const JUMPS = {
  welcome:()=>{ const l=S.lang; S=fresh(); S.lang=l; go("welcome"); },
  consent:()=>go("consent"),
  photo:()=>{ S.photo="idle"; go("photo"); },
  quiz:()=>{ S.q=0; go("quiz"); },
  routine:()=>{ if(!S.answers.feel) fillDemo(); if(S.photo!=="done") S.photo="done"; S.tab="am"; go("routine"); },
  scan:()=>{ if(!S.answers.feel) fillDemo(); S.scan="idle"; go("scan"); },
  chat:()=>{ if(!S.answers.feel) fillDemo(); go("chat"); },
  checkin:()=>{ if(!S.answers.feel) fillDemo(); S.checkin="lock"; S.feeling=null; S.checkinSwap=false; go("checkin"); },
  me:()=>{ if(!S.answers.feel) fillDemo(); go("me"); }
};
function toggleDemo(){
  const p=$("demoPanel"); p.classList.toggle("open");
  p.innerHTML=`<div class="row"><b class="spacer">Demo controls</b><button data-close style="width:auto">Close</button></div>
    <div class="grid">${Object.keys(JUMPS).map((k,i)=>`<button data-jump="${k}">${i+1}. ${k}</button>`).join("")}</div>
    <span class="small" style="opacity:.6">Keys 1–9 jump · R resets · L switches language</span>`;
  p.onclick=e=>{ const b=e.target.closest("button"); if(!b) return; if(b.dataset.jump){ JUMPS[b.dataset.jump](); p.classList.remove("open"); } if("close" in b.dataset) p.classList.remove("open"); };
}
document.addEventListener("keydown", e=>{
  if(e.target.tagName==="INPUT") return;
  const keys=Object.keys(JUMPS), n=parseInt(e.key,10);
  if(n>=1 && n<=keys.length){ JUMPS[keys[n-1]](); return; }
  if(e.key==="d"||e.key==="D"){ toggleDemo(); return; }
  if(e.key==="r"||e.key==="R"){ JUMPS.welcome(); return; }
  if(e.key==="l"||e.key==="L"){ S.lang=S.lang==="en"?"ja":"en"; render(); return; }
  if(["ArrowRight","ArrowLeft","PageDown","PageUp"," ","Escape","f","F","n","N"].includes(e.key)){ post({type:"pibu:key",key:e.key}); if(e.key===" ") e.preventDefault(); }
});
function post(msg){ try{ if(window.parent!==window) window.parent.postMessage(msg,"*"); }catch(_){} }
window.addEventListener("message", e=>{
  const m=e.data||{}; if(typeof m!=="object") return;
  if(m.type==="pibu:framed") document.body.classList.add("framed");
  if(m.type==="pibu:goto" && JUMPS[m.screen]) JUMPS[m.screen]();
  if(m.type==="pibu:lang"){ S.lang=m.lang; render(); }
  if(m.type==="pibu:ask" && S.screen==="chat"){ const qa=QA()[m.i||0]; if(qa) ask(qa.q,qa); }
});
if(/[?&]framed/.test(location.search)) document.body.classList.add("framed");


render();
})();
</script>
